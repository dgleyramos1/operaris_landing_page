<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro — Operaris ERP</title>
  <meta name="description" content="Cadastre seu estabelecimento e comece a usar o Operaris ERP." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🍽️</div>
        Operaris
      </a>
      <a id="back-link" href="index.html#planos" class="btn btn-outline">← Voltar aos planos</a>
    </div>
  </nav>

  <!-- FORM PAGE -->
  <div class="form-page">
    <div class="container">
      <div class="form-wrapper">

        <div class="form-card fade-in">
          <div class="form-header">
            <div class="eyebrow">Cadastro</div>
            <h1>Criar sua conta</h1>
            <p>Preencha os dados do seu estabelecimento para continuar para o pagamento.</p>
          </div>

          <!-- Plan summary -->
          <div class="plan-summary">
            <div>
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:2px;">Plano selecionado</div>
              <div class="plan-summary-name" id="plan-name">Carregando…</div>
            </div>
            <div class="plan-summary-price" id="plan-price">—</div>
          </div>

          <!-- Global error -->
          <div id="form-global-error" class="form-error" style="display:none;margin-bottom:16px;font-size:14px;padding:12px 16px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;"></div>

          <form id="register-form" novalidate>
            <!-- Establishment name -->
            <div class="form-group">
              <label for="name">Nome do estabelecimento *</label>
              <input
                type="text"
                id="name"
                name="name"
                class="form-input"
                placeholder="Ex: Restaurante do João"
                autocomplete="organization"
                required
              />
              <div id="err-name" class="form-error" style="display:none;"></div>
            </div>

            <!-- Email -->
            <div class="form-group">
              <label for="email">E-mail de contato *</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="contato@seurestaurante.com.br"
                autocomplete="email"
                required
              />
              <div id="err-email" class="form-error" style="display:none;"></div>
            </div>

            <!-- Phone + Document -->
            <div class="form-row">
              <div class="form-group">
                <label for="phone">Telefone / WhatsApp *</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="form-input"
                  placeholder="(11) 98765-4321"
                  autocomplete="tel"
                  required
                />
                <div id="err-phone" class="form-error" style="display:none;"></div>
              </div>
              <div class="form-group">
                <label for="document">CPF ou CNPJ</label>
                <input
                  type="text"
                  id="document"
                  name="document"
                  class="form-input"
                  placeholder="000.000.000-00"
                  inputmode="numeric"
                />
                <div id="err-document" class="form-error" style="display:none;"></div>
              </div>
            </div>

            <!-- Address -->
            <div class="form-group">
              <label for="address">Endereço</label>
              <input
                type="text"
                id="address"
                name="address"
                class="form-input"
                placeholder="Rua, número, bairro, cidade/UF"
                autocomplete="street-address"
              />
              <div id="err-address" class="form-error" style="display:none;"></div>
            </div>

            <button type="submit" id="submit-btn" class="form-submit">
              Continuar para pagamento →
            </button>

            <p class="form-note">
              Ao continuar, você será redirecionado ao ambiente seguro de pagamento da Asaas.<br/>
              Aceitamos Pix, boleto e cartão de crédito.
            </p>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
